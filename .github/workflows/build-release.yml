name: Python package

on:
  push:
    paths:
      - "setup.py"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-2022
            python-version: "3.10"
          - platform: Windows
            os: windows-2022
            python-version: "3.11"
          - platform: Windows
            os: windows-2022
            python-version: "3.12"
          - platform: Linux
            os: ubuntu-latest
            python-version: "3.10"
            cibw-version: "cp310-manylinux_x86_64"
          - platform: Linux
            os: ubuntu-latest
            python-version: "3.11"
            cibw-version: "cp311-manylinux_x86_64"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: >
          python -m pip install --upgrade pip "setuptools==75.8.2" wheel &&
          pip install torch==2.7.1 torchvision==0.22.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cu126
      - name: Setup Windows CUDA
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda-toolkit
        with:
          cuda: "12.6.2"
          method: "network"
          sub-packages: '["nvcc", "cudart"]'
      - name: Build Windows package
        if: runner.os == 'Windows'
        run: python setup.py bdist_wheel
        env:
          TORCH_CUDA_ARCH_LIST: Turing
      - name: Build Windows source distribution
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        run: python setup.py sdist

      - name: Build Linux wheels
        if: runner.os == 'Linux'
        uses: pypa/cibuildwheel@v2.22.0
        with:
          output-dir: dist
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_BUILD: >
            yum install -y dnf-plugins-core &&
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo &&
            yum install --setopt=obsoletes=0 -y cuda-nvcc-12-6-12.6.85-1 cuda-cudart-devel-12-6-12.6.77-1 &&
            export LD_LIBRARY_PATH="/usr/local/lib:/usr/local/cuda/lib64:$LD_LIBRARY_PATH" && export BUILD_WITH_CUDA=1 &&
            python -m pip install -U torch==2.7.1 torchvision==0.22.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cu126 &&
            python -m pip install -U "pillow<12.3" &&
            python -c "import torch,os;print(os.path.join(os.path.dirname(torch.__file__),'lib'))" > /etc/ld.so.conf.d/999_torch.conf &&
            python -m pip install -U auditwheel setuptools wheel meson-python
          CIBW_BUILD: ${{ matrix.cibw-version }}
          CIBW_ENVIRONMENT: TORCH_CUDA_ARCH_LIST=Turing
          CIBW_BUILD_VERBOSITY: 1
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "python -m auditwheel repair --exclude 'libtorch*.so' -w {dest_dir} {wheel}"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.platform }}-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          pattern: distributions-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
